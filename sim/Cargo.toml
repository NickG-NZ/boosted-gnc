[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/sim-env", "crates/sim-vehicle", "crates/sim-telemetry", "crates/sim-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-env = { path = "crates/sim-env" }
sim-vehicle = { path = "crates/sim-vehicle" }
sim-telemetry = { path = "crates/sim-telemetry" }
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
approx = "0.5"

[profile.release]
opt-level = 3
debug = false
