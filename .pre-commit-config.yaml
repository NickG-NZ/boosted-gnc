repos:
  - repo: local
    hooks:
      - id: isort
        name: isort (sort imports)
        entry: uv run isort
        language: system
        types: [python]
      - id: imports-at-top
        name: imports at top of file (ruff E402, PLC0415)
        entry: uv run ruff check
        language: system
        types: [python]
      - id: tsc
        name: typecheck viewer (tsc)
        entry: bash -c 'cd web && npx --no-install tsc --noEmit'
        language: system
        files: ^web/(src/.*\.ts|tsconfig\.json|package\.json)$
        pass_filenames: false
